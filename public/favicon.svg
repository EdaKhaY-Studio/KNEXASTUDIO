<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Glowing Lightning Zap Symbol -->
  <path
    d="M35 8 L18 34 H31 L27 56 L47 28 H33 L35 8 Z"
    fill="url(#boltGrad)"
    stroke="#a7f3d0"
    stroke-width="1"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />
</svg>
